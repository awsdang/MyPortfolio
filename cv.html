<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aws Abdulfattah | CV</title>
    <meta name="description" content="Senior Software Engineer CV for Aws Abdulfattah." />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        min-width: 320px;
        background: #0b0c09;
        color: #11130f;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .cv-shell { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
      .cv-bar {
        position: relative;
        z-index: 2;
        min-height: 72px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: max(12px, env(safe-area-inset-top)) 20px 12px;
        background: #fffefa;
        border-bottom: 1px solid rgba(17, 19, 15, 0.16);
      }
      .cv-name { margin-right: auto; font-size: 14px; font-weight: 800; }
      .cv-name small { display: block; margin-top: 2px; color: #565950; font-size: 10px; font-weight: 600; }
      .cv-action {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border: 1px solid #11130f;
        border-radius: 999px;
        color: #11130f;
        font-size: 12px;
        font-weight: 750;
        text-decoration: none;
      }
      .cv-action.primary { background: #caff3d; }
      .cv-action:focus-visible { outline: 2px solid #2357ff; outline-offset: 2px; }
      .cv-frame {
        width: 100%;
        height: calc(100dvh - 72px);
        min-height: 560px;
        display: block;
        border: 0;
        background: #32342f;
      }
      object.cv-frame iframe { width: 100%; height: 100%; border: 0; }
      @media (max-width: 640px) {
        .cv-bar { min-height: 112px; flex-wrap: wrap; padding-inline: 12px; }
        .cv-name { width: 100%; }
        .cv-action { flex: 1; }
        .cv-frame { height: calc(100dvh - 112px); }
      }
    </style>
  </head>
  <body>
    <main class="cv-shell">
      <header class="cv-bar">
        <div class="cv-name">AWS ABDULFATTAH<small>Senior Software Engineer CV</small></div>
        <a class="cv-action" href="index.html">Back to the site</a>
        <a
          class="cv-action primary"
          href="cv/Aws_Abdulfattah__Senior_Software_Engineer.pdf"
          download="Aws_Abdulfattah_Senior_Software_Engineer_CV.pdf"
        >Download PDF</a>
      </header>
      <object
        class="cv-frame"
        data="cv/Aws_Abdulfattah__Senior_Software_Engineer.pdf#view=FitH&amp;toolbar=1"
        type="application/pdf"
        aria-label="Aws Abdulfattah Senior Software Engineer CV"
      >
        <iframe
          src="cv/Aws_Abdulfattah__Senior_Software_Engineer.pdf#view=FitH&amp;toolbar=1"
          title="Aws Abdulfattah Senior Software Engineer CV"
        ></iframe>
      </object>
    </main>
  </body>
</html>
